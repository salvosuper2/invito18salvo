<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Invito 18° Salvo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #080a0b;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 10px;
    }
    .phone-frame {
      position: relative;
      width: min(100vw - 20px, 56.25vh - 20px, 540px);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: #111;
      box-shadow: 0 18px 60px rgba(0,0,0,.65);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .page {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      transition: opacity .45s ease, transform .45s ease, filter .45s ease;
    }
    .front {
      background-image: url("assets/page1.jpg");
      z-index: 2;
    }
    .inside {
      background-image: url("assets/page2.jpg");
      z-index: 1;
      opacity: 0;
      transform: scale(1.02);
    }
    .opened .front {
      opacity: 0;
      transform: scale(.985);
      pointer-events: none;
      filter: blur(1px);
    }
    .opened .inside {
      opacity: 1;
      transform: scale(1);
    }
    .open-zone {
      position: absolute;
      left: 15%;
      top: 37%;
      width: 70%;
      height: 26%;
      z-index: 4;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 0;
      font-size: 0;
      color: transparent;
    }
    .opened .open-zone { display: none; }

    .music-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 8;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,.55);
      background: rgba(0,0,0,.38);
      color: #fff;
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      backdrop-filter: blur(4px);
      display: grid;
      place-items: center;
    }
    .music-note {
      display: inline-block;
      font: 700 22px/1 Georgia, serif;
      transform-origin: 50% 50%;
    }
    .music-btn.playing {
      background: rgba(255,255,255,.22);
    }
    .music-btn.playing .music-note {
      animation: musicSpin 1s linear infinite;
    }
    @keyframes musicSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .hotspot {
      position: absolute;
      z-index: 6;
      display: none;
      background: transparent;
      border: 0;
      text-decoration: none;
      font-size: 0;
      color: transparent;
      line-height: 0;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .opened .hotspot { display: block; }
    .location-hotspot {
      left: 7%;
      top: 64%;
      width: 38%;
      height: 17%;
    }
    .confirm-hotspot {
      left: 55%;
      top: 64%;
      width: 38%;
      height: 17%;
    }
    .back {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 7;
      display: none;
      border: 1px solid rgba(255,255,255,.45);
      background: rgba(0,0,0,.35);
      color: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      font: 600 13px/1 system-ui, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .opened .back { display: block; }
    @media (min-aspect-ratio: 9/16) {
      .phone-frame {
        height: min(100vh - 20px, 960px);
        width: auto;
      }
    }
  </style>
</head>
<body>
  <main class="phone-frame" id="invito" aria-label="Invito 18° Salvo">
    <section class="page inside" aria-label="Dettagli invito"></section>
    <section class="page front" aria-label="Busta, clicca per aprire"></section>

    <audio id="bgMusic" src="assets/musica-ritornello.mp3" loop preload="auto" autoplay muted playsinline></audio>
    <button class="music-btn" id="musicBtn" type="button" aria-label="Avvia o stoppa la musica"><span class="music-note">♪</span></button>

    <button class="open-zone" id="openInvite" type="button" aria-label="Clicca la busta per aprire">Apri</button>
    <a class="hotspot location-hotspot" href="https://www.google.com/search?q=villa+ciglietti&sca_esv=a82350b6429375af&sxsrf=ANbL-n63TLsoTFHTxX2kobssp8uvIFysFA%3A1780523123977&source=hp&ei=c6AgaoyKOeuN-d8P3PuRiQ8&iflsig=AFdpzrgAAAAAaiCug49pW1664wZTv08ArYNSYzEBoKEy&gs_ssp=eJzj4tVP1zc0TDbOMk02zDMxYLRSMagwNDa0TEs2t0w1MQABQyuDCgtDk8REC0MDcyNzY0tzIy_-ssycnESF5Mz0nMzUkpJMAHnYE0A&oq=villa+ciglietti&gs_lp=Egdnd3Mtd2l6Ig92aWxsYSBjaWdsaWV0dGkqAggAMgsQLhivARjHARiABDIFEAAYgAQyBRAAGIAEMgUQABiABDIGEAAYFhgeMgYQABgWGB4yAhAmMggQABiABBiiBDIFEAAY7wVIrydQAFj1GXAAeACQAQCYAeYBoAHPD6oBBjAuMTQuMbgBAcgBAPgBAZgCD6AC7xDCAgsQABiABBixAxiDAcICCxAuGIAEGLEDGIMBwgIREAAYgAQYigUYjQYYsQMYgwHCAggQABiABBixA8ICCxAuGIAEGMcBGNEDwgIjEC4YgAQYigUYjQYYsQMYgwEYxwEYrwEYmAUYngUYmQUYjgXCAg4QABiABBiKBRixAxiDAcICHRAuGIAEGLEDGIMBGMcBGK8BGJgFGJ4FGJkFGI4FwgIOEC4YgAQYsQMYxwEY0QPCAhEQLhiABBixAxjHARivARiOBcICCxAuGIAEGMcBGK8BwgIFEC4YgATCAh0QLhiDARivARjHARixAxiABBiYBRiZBRieBRiOBcICDhAuGIAEGMcBGK8BGI4FwgIOEC4YrwEYxwEYgAQYjgXCAhQQLhiABBixAxjHARivARiYBRiZBcICFBAuGK8BGMcBGLEDGIAEGJgFGJkFwgIOEC4YgAQYxwEYrwEYmAWYAwCSBwYwLjE0LjGgB8f2AbIHBjAuMTQuMbgH7xDCBwUyLTYuOcgHfIAIAQ&sclient=gws-wiz" target="_blank" rel="noopener" aria-label="Apri location">Location</a>
    <a class="hotspot confirm-hotspot" href="https://wa.me/3387732603?text=Grazie%2C%20per%20l%27%20invito%20.%20Ci%20sar%C3%B2%20%21" target="_blank" rel="noopener" aria-label="Conferma su WhatsApp">Conferma</a>
    <button class="back" id="backInvite" type="button">Chiudi</button>
  </main>

  <script>

    const card = document.getElementById('invito');
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');

    function updateMusicButton() {
      musicBtn.classList.toggle('playing', !music.paused);
    }

    async function startMusicAutomatically() {
      try {
        await music.play();

        // unmute shortly after autoplay starts
        setTimeout(() => {
          music.muted = false;
        }, 300);

      } catch (e) {
        console.log('Autoplay bloccato dal browser');
      }
      updateMusicButton();
    }

    async function toggleMusic(event) {
      event.stopPropagation();

      if (music.paused) {
        try {
          music.muted = false;
          await music.play();
        } catch (e) {}
      } else {
        music.pause();
      }

      updateMusicButton();
    }

    musicBtn.addEventListener('click', toggleMusic);

    window.addEventListener('load', startMusicAutomatically);

    document.getElementById('openInvite').addEventListener('click', async () => {
      card.classList.add('opened');

      if (music.paused) {
        try {
          music.muted = false;
          await music.play();
        } catch (e) {}
      }

      updateMusicButton();
    });

    document.getElementById('backInvite').addEventListener('click', () => {
      card.classList.remove('opened');
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        card.classList.remove('opened');
      }
    });

    music.addEventListener('play', updateMusicButton);
    music.addEventListener('pause', updateMusicButton);

    updateMusicButton();

</script>
</body>
